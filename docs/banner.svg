<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b25"/>
      <stop offset="0.6" stop-color="#123f37"/>
      <stop offset="1" stop-color="#1d6b5a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17574a"/>
      <stop offset="1" stop-color="#0e3a32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d58a"/>
      <stop offset="1" stop-color="#b8861b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#e9c56f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e9c56f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="70" width="44" height="32" rx="8" fill="url(#gold)"/>
    <text x="132" y="96" font-size="26" font-weight="700" fill="#f3efe2">APEX Wallet</text>
    <text x="72" y="190" font-size="58" font-weight="800" fill="#f3efe2">Your wallet,</text>
    <text x="72" y="258" font-size="58" font-weight="800" fill="#e9c56f">faster<tspan fill="#f3efe2"> than cash.</tspan></text>
    <text x="72" y="310" font-size="20" fill="#cfe3dc">Mobile e-wallet built 100% in Oracle SQL, PL/SQL &amp; APEX</text>
    <text x="72" y="340" font-size="20" fill="#cfe3dc">Double-entry ledger · Fraud engine · Escrow · BNPL · Circles · AR / EN</text>
  </g>

  <g transform="translate(880 92) rotate(-6)">
    <rect width="320" height="200" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="252" y="24" width="44" height="32" rx="7" fill="url(#gold)"/>
    <text x="24" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f3efe2">My Wallet</text>
    <text x="24" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#cfe3dc">Available balance</text>
    <text x="24" y="138" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="700" fill="#f3efe2">1,250.000</text>
    <text x="24" y="178" font-family="Consolas, Menlo, monospace" font-size="15" fill="#cfe3dc" letter-spacing="2">079 •••• 4567</text>
    <text x="248" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#e9c56f">Verified</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" fill="#f3efe2">
    <rect x="880" y="320" width="104" height="58" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="896" y="348" font-size="20" font-weight="700" fill="#e9c56f">3.8ms</text>
    <text x="896" y="367" font-size="11" fill="#cfe3dc">per transfer</text>
    <rect x="996" y="320" width="104" height="58" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="1012" y="348" font-size="20" font-weight="700" fill="#e9c56f">25/25</text>
    <text x="1012" y="367" font-size="11" fill="#cfe3dc">auto tests</text>
    <rect x="1112" y="320" width="104" height="58" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <text x="1128" y="348" font-size="20" font-weight="700" fill="#e9c56f">0.000</text>
    <text x="1128" y="367" font-size="11" fill="#cfe3dc">ledger drift</text>
  </g>
